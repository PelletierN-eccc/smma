# R CMD check on GC Code (GitLab). Requires a runner that can pull Docker images.
check:
  image: rocker/r-ver:4.4.2
  script:
    - R -q -e 'install.packages(c("nnls","readxl","ggplot2","testthat","knitr","rmarkdown","nlme"), repos = "https://cloud.r-project.org")'
    - R CMD build --no-build-vignettes .
    - R CMD check --no-manual --ignore-vignettes smma_*.tar.gz
  artifacts:
    when: always
    paths:
      - smma.Rcheck/
